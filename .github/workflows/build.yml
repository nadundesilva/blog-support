name: Build

on:
  - push
  - pull_request

permissions:
  contents: read
  packages: read

jobs:
  run-super-linter:
    name: Run GitHub Super Linter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      statuses: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Lint Code Base
        uses: super-linter/super-linter@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KUBERNETES_KUBECONFORM_OPTIONS: "--ignore-missing-schemas"
          VALIDATE_JSCPD: "false"
          VALIDATE_CHECKOV: "false"
          VALIDATE_BIOME_FORMAT: "false"

  build-samples:
    name: Build Samples
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - scoverage-in-maven-parallel-builds
          - power-up-your-scala-code-with-implicit-conversions
          - speeding-up-pod-startup-in-an-autoscaling-kubernetes-cluster
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: adopt
          java-version: "21"
      - name: Setup Minikube
        uses: medyagh/setup-minikube@e9e035a86bbc3caea26a450bd4dbf9d0c453682e # v0.0.21
      - name: Build
        working-directory: articles/${{ matrix.project }}
        run: ./run.sh
